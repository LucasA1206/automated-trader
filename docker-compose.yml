version: '3.8'

services:
  # ─── IB Gateway (headless IBKR connection) ─────────────────────
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:latest
    restart: always
    environment:
      - TWS_USERID=${IB_USER}
      - TWS_PASSWORD=${IB_PASS}
      - TRADING_MODE=${TRADING_MODE:-paper}      # paper | live
      - VNC_SERVER_PASSWORD=${VNC_PASSWORD}
    ports:
      - "4001:4001"    # Live trading API port
      - "4002:4002"    # Paper trading API port
      - "5900:5900"    # VNC for debugging (optional)
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4002"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Backend API + Scheduler ────────────────────────────────────
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      ib-gateway:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - IB_HOST=ib-gateway
      - IB_PORT=4002
      - DATABASE_URL=postgresql://${POSTGRES_USER:-blitz}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-blitztrader}
      - JWT_SECRET=${JWT_SECRET}
      - IB_USER=${IB_USER}
      - IB_PASS=${IB_PASS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FINNHUB_API_KEY=${FINNHUB_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
    volumes:
      - ./backend:/app    # Hot reload for dev
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000

  # ─── PostgreSQL ─────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-blitz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Database password required}
      - POSTGRES_DB=${POSTGRES_DB:-blitztrader}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

volumes:
  postgres_data:
